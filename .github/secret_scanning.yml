# This repository is a secret scanner, so its tests and evaluation corpus are
# full of values shaped exactly like real credentials. None of them are real.
# Without this, GitHub's own scanning raises an alert for every fixture once
# the repository is public.
paths-ignore:
  - 'packages/eval/src/corpus/**'
  - 'packages/**/*.test.ts'
  - 'packages/**/*.test.tsx'
  - 'packages/demo/src/samples.ts'
