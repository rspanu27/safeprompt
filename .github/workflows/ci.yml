name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      # Fails if precision, recall or classification accuracy drops below
      # packages/eval/baseline.json.
      - name: Evaluate detectors
        if: ${{ !cancelled() }}
        run: pnpm eval

      # `pnpm eval` rewrites the report, so a diff here means a detector changed
      # without the committed numbers being regenerated.
      - name: Report is up to date
        if: ${{ !cancelled() }}
        run: git diff --exit-code docs/EVALUATION.md
